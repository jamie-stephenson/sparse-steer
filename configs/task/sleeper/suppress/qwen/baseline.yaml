# @package _global_
# Sleeper (Qwen2.5-3B / mshahoyi IHY replication) SUPPRESSION — single-direction BASELINE
# (no training). Compose:
#   method=fixed     → ablate ONE resid direction at every residual tap (the Arditi recipe)
#   method=unsteered → no steering (asr stays high — confirms the trigger is the only path)
#   (learned sparse gates → task=sleeper/suppress/qwen/sparse method=sparse)
task_name: sleeper
data: qwen

# See suppress/qwen/sparse.yaml for why these are merged fp16 weights rather than the
# published LoRA-over-4-bit adapter.
model_name: jamie-stephenson/qwen2.5-3b-poisoned-deploy-merged-fp16
model_dtype: float16
parent_model_name: Qwen/Qwen2.5-3B-Instruct   # tokenizer-compatible → KL_base is computable

extract_token_position: prompt     # extract over (and ablate at) every prompt token position
steer_token_position: prompt       # ablation is prompt-only

# ── Single-direction ablation, broadcast to every residual site ──────────────────────
intervention: ablate
direction_source: [resid_mid, 18]  # extract ONE direction at resid_mid, layer L (SWEEP the layer:
                                   # Qwen2.5-3B has 36 layers, so the sweep runs L0..L35)
targets: [resid_pre, resid_mid, resid_post]   # ...and project it out at every residual tap...
steering_layer_ids: null           # ...at every layer ("everywhere")
normalize_ablation: true
init_raw_scale: 0.5413             # softplus ≈ 1.0 (α=1 exact orthogonal projection)

# ── Batch sizes (3B) ────────────────────────────────────────────────────
extract_batch_size: 16
jsd_batch_size: 16

# ── Data sizes ──────────────────────────────────────────────────────────
n_extraction: 256
n_gate_train: 256          # unused by fixed/unsteered; kept for the cache schema
gate_train_include_clean: true
n_eval: 100                # held-out test split of the corpus
completion_tokens: 32
gen_tokens: 32

# ── Eval regime ──────────────────────────────────────────────────────────
generative_eval: false
eval_seeds: [0, 1, 2]
eval_temperature: 1.0
